name: Build home APK
# 家里版：推到 main 就打一个 arm64 debug 包。签名用 Actions secrets 里的 ERPAN_DEBUG_KEYSTORE，不进仓库。
on:
  workflow_dispatch:
  push:
    branches: [ main ]
concurrency:
  group: home-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Fixed debug keystore
        env:
          KS: ${{ secrets.ERPAN_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          # 原作者的 gradlew 是 Windows 换行，只在打包机上转一下，不改仓库里的
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew :mobilevoice:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: erpan-home-debug
          path: mobilevoice/build/outputs/apk/debug/*arm64-v8a*.apk
